<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAD Homework 1 - Login</title>
    <link rel="stylesheet" href="res/css/style.css">
</head>

<body>
    <header class="header">
        <nav>
            <a href="index.html">Home</a>
        </nav>
        <div class="profile-control">
            <button class="profile-toggle" type="button" aria-label="Open login page" aria-expanded="false">
                <img class="profile-icon" src="res/images/avatar.jpg" alt="">
            </button>
            <div class="profile-dropdown" hidden>
                <p class="profile-name"></p>
                <p class="profile-email"></p>
                <button class="logout-btn" type="button">logout</button>
            </div>
        </div>
    </header>

    <div class="content">
        <div class="form-wrapper">
            <div class="form-container center">
                <h1>Welcome to PostIt</h1>
            <a class="link" href="#">Create an account</a>
            <p class="or">or<br>Please log in</p>
            <form action="index.html">
                <input type="email" placeholder="Email" aria-label="Email" autocomplete="email" required>
                <input type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
                <button class="submit-btn" type="submit">Log in</button>
            </form>
            <a class="link forgot" href="#">Forget password</a>
            </div>
        </div>
    </div>
    <script src="src/js/profileMenu.js"></script>
</body>
